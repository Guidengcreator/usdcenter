services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uzd_expert
      POSTGRES_PASSWORD: uzd_expert
      POSTGRES_USER: uzd_expert
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzd_expert -d uzd_expert"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uzd_expert_test
      POSTGRES_PASSWORD: uzd_expert
      POSTGRES_USER: uzd_expert
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzd_expert -d uzd_expert_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
